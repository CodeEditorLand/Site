<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
	<!-- Background -->
	<rect width="1200" height="630" fill="#ffffff" />

	<!-- Top accent line -->
	<rect width="1200" height="4" fill="#151515" fill-opacity="0.12" />

	<!-- Logo glyph (bottom-right, decorative) -->
	<g transform="translate(880, 370) scale(0.16)">
		<rect width="1005.28" height="620.771" rx="91.3889"
			transform="matrix(-0.93358 0.358368 0 1 940 0.240723)"
			fill="#151515" fill-opacity="0.15" />
		<rect width="1005.28" height="620.771" rx="91.3889"
			transform="matrix(-0.93358 0.358368 0 1 1880 618.204)"
			fill="#151515" fill-opacity="0.15" />
	</g>

	<!-- Section badge -->
	<rect x="80" y="60" width="88" height="36" rx="6" fill="#151515" fill-opacity="0.08" />
		<text x="96" y="84" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="16" font-weight="600" fill="#555555" letter-spacing="0.08em">HOME</text>

	<!-- Title -->
	<text x="80" y="140" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="48" font-weight="700" fill="#151515">Land | The Next-Generation Code</text>
		<text x="80" y="200" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="48" font-weight="700" fill="#151515">Editor</text>

	<!-- Description -->
	<text x="80" y="284" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="20" font-weight="400" fill="#666666">A high-performance, resource-efficient code editor built</text>
		<text x="80" y="314" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="20" font-weight="400" fill="#666666">with Rust and Tauri. Experience VS Code compatibility</text>
		<text x="80" y="344" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="20" font-weight="400" fill="#666666">without the Electron bloat.</text>

	<!-- Bottom bar -->
	<rect y="574" width="1200" height="56" fill="#fafafa" />
	<line x1="0" y1="574" x2="1200" y2="574" stroke="#e5e5e5" stroke-width="1" />

	<!-- URL (bottom-left) -->
	<text x="80" y="608" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="16" font-weight="500" fill="#888888">editor.land</text>

	<!-- Brand name (bottom-right) -->
	<text x="1120" y="608" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="16" font-weight="600" fill="#888888" text-anchor="end">Code Editor Land</text>
</svg>